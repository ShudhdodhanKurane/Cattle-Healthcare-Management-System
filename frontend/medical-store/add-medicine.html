<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add medicine</title><link rel="stylesheet" href="../assets/css/farmer.css"></head><body data-page="medicines"><div class="farmer-layout"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">+</span> Herdwell</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="medicines.html">Medicines</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="sales.html">Sales</a><a href="reports.html">Reports</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></nav></aside><main class="main"><header class="topbar"><div><button class="menu-button">☰</button><h1>Add medicine</h1><p>Create a product in your catalog</p></div><span class="avatar">GC</span></header><section class="content"><article class="card"><form class="form-grid" data-demo-form><div class="field"><label for="name">Medicine name</label><input id="name" required placeholder="Product name"></div><div class="field"><label for="category">Category</label><select id="category"><option>Nutrition</option><option>Antibiotic</option><option>Vaccine</option><option>Topical care</option></select></div><div class="field"><label for="pack">Pack size</label><input id="pack" placeholder="e.g. 100 ml"></div><div class="field"><label for="price">Selling price (₹)</label><input id="price" type="number" required></div><div class="field"><label for="stock">Opening stock</label><input id="stock" type="number" required></div><div class="field"><label for="reorder">Reorder level</label><input id="reorder" type="number" value="10"></div><div class="field full"><label for="notes">Description</label><textarea id="notes" placeholder="Usage and storage notes"></textarea></div><div class="field full"><button class="button" type="submit">Save medicine</button><p class="form-notice" aria-live="polite"></p></div></form></article></section></main></div><script src="../assets/js/farmer.js"></script></body></html>
